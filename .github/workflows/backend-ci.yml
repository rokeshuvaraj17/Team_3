name: Backend CI

on:
  push:
    paths:
      - 'Backend/Node/**'
  pull_request:
    paths:
      - 'Backend/Node/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Backend/Node/package-lock.json

      - name: Install dependencies
        working-directory: Backend/Node
        run: npm ci

      - name: Run tests
        working-directory: Backend/Node
        run: npm test
